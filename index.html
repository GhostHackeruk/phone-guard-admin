<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>PHONE GUARD • Admin</title>
  <style>
    :root{
      --bg:#050b0a; --line:rgba(0,255,160,.14);
      --neon:#00ffa0; --neon2:#00d4ff; --text:#dffdf3; --muted:#86c9b5;
      --shadow:0 0 40px rgba(0,255,160,.10), inset 0 0 60px rgba(0,40,20,.35);
      --danger:#ff5b6e;
    }
    *{box-sizing:border-box}
    body{
      margin:0; min-height:100vh; color:var(--text);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,"Liberation Mono","Courier New", monospace;
      background:
        radial-gradient(900px 600px at 20% -10%, rgba(0,255,160,.18), transparent 55%),
        radial-gradient(700px 500px at 120% 20%, rgba(0,212,255,.16), transparent 55%),
        radial-gradient(700px 500px at 50% 120%, rgba(0,255,160,.10), transparent 55%),
        var(--bg);
      padding:18px 14px 40px;
    }
    .wrap{max-width:620px;margin:0 auto}
    .card{
      border:1px solid var(--line); border-radius:22px;
      background:rgba(0,0,0,.22); box-shadow:var(--shadow);
      padding:16px;
    }
    .brand{letter-spacing:.22em; font-weight:900; text-align:center; color:var(--neon); font-size:22px}
    .sub{margin-top:6px; text-align:center; color:var(--neon2); font-size:12px; opacity:.9}

    .box{
      margin-top:14px;
      border:1px solid rgba(0,255,160,.16);
      border-radius:18px;
      padding:14px;
      background:rgba(0,0,0,.22);
    }
    .row{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
    .pill{
      flex:1;
      border:1px solid rgba(0,255,160,.18);
      border-radius:16px;
      padding:12px 14px;
      min-width:180px;
      background:rgba(0,0,0,.18);
      color:var(--text);
    }
    input{
      width:100%;
      border:1px solid rgba(0,255,160,.16);
      border-radius:14px;
      padding:12px 12px;
      background:rgba(0,0,0,.25);
      color:var(--text);
      outline:none;
    }
    input::placeholder{color:rgba(223,253,243,.55)}
    .btn{
      border:0; border-radius:14px;
      padding:11px 14px;
      background:linear-gradient(90deg, rgba(0,255,160,.95), rgba(0,212,255,.85));
      font-weight:900; letter-spacing:.08em; cursor:pointer;
      color:#03100d;
    }
    .btn2{
      border:1px solid rgba(0,255,160,.25);
      background:transparent;
      color:var(--neon);
      border-radius:14px;
      padding:11px 14px;
      font-weight:900; cursor:pointer;
    }
    .msg{
      margin-top:10px;
      border:1px solid rgba(0,255,160,.16);
      border-radius:14px;
      padding:10px 12px;
      color:var(--muted);
      background:rgba(0,0,0,.18);
      font-size:13px;
      white-space:pre-line;
    }
    .err{border-color:rgba(255,91,110,.35); color:#ffd7dc}
    .hide{display:none !important}
    h3{margin:0 0 8px 0; color:var(--neon); letter-spacing:.08em}
    small{color:var(--muted)}
  </style>
</head>

<body>
  <div class="wrap">
    <div class="card">
      <div class="brand">PHONE GUARD</div>
      <div class="sub">Admin Panel • Deposit & Settings</div>

      <!-- ✅ LOGIN BOX -->
      <div class="box" id="loginBox">
        <h3>Admin Login</h3>
        <div class="row">
          <div class="pill">
            <div style="margin-bottom:8px; color:var(--muted); font-size:12px;">Email</div>
            <input id="email" type="email" placeholder="admin@gmail.com"/>
          </div>
          <div class="pill">
            <div style="margin-bottom:8px; color:var(--muted); font-size:12px;">Password</div>
            <input id="pass" type="password" placeholder="••••••••"/>
          </div>
        </div>
        <div class="row" style="margin-top:10px;">
          <button class="btn" id="btnLogin">LOGIN</button>
        </div>
        <div class="msg" id="loginMsg">Please login with admin email & password.</div>
      </div>

      <!-- ✅ PANEL (login হলে দেখাবে) -->
      <div class="box hide" id="panelBox">
        <div class="row">
          <div class="pill" id="adminState">Admin: Checking...</div>
          <button class="btn2" id="btnRefresh">Refresh</button>
          <button class="btn" id="btnLogout">Logout</button>
        </div>

        <div class="box" style="margin-top:12px;">
          <h3>Pending Deposit Requests</h3>
          <small>Approve করলে user balance বাড়বে, status = approved হবে।</small>
          <div class="msg" id="depositList" style="margin-top:10px;">Loading...</div>
        </div>

        <div class="box" style="margin-top:12px;">
          <h3>Payment Numbers (Settings)</h3>
          <small>Firestore path: settings/payment</small>

          <div style="height:10px"></div>
          <input id="bkash" placeholder="bKash number"/>
          <div style="height:10px"></div>
          <input id="nagad" placeholder="Nagad number"/>
          <div style="height:10px"></div>
          <input id="rocket" placeholder="Rocket number"/>

          <div class="row" style="margin-top:10px;">
            <button class="btn2" id="btnLoadSettings">Load</button>
            <button class="btn" id="btnSaveSettings">Save</button>
          </div>
          <div class="msg" id="settingsMsg">Ready.</div>
        </div>
      </div>

      <!-- ✅ SCRIPTS -->
      <script type="module" src="./firebase.js"></script>
      <script type="module" src="./admin.js"></script>
    </div>
  </div>
</body>
</html>
